<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier Cours - OpenISTA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            margin-bottom: 20px;
            color: #0d6efd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 form-container">
                <h2>Modifier le cours</h2>
                
                <!-- Affichage des messages flash -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                
                <form method="POST" enctype="multipart/form-data">
                    
                    <div class="mb-3">
                        <label for="code" class="form-label">Code du cours</label>
                        <input type="text" class="form-control" id="code" name="code" 
                               value="{{ cours.code }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="titre" class="form-label">Titre</label>
                        <input type="text" class="form-control" id="titre" name="titre" 
                               value="{{ cours.titre }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" 
                                  rows="3" required>{{ cours.description }}</textarea>
                    </div>
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="cycle" class="form-label">Cycle</label>
                            <select class="form-select" id="cycle" name="cycle" required>
                                <option value="bac" {% if cours.cycle == 'bac' %}selected{% endif %}>Baccalauréat</option>
                                <option value="master" {% if cours.cycle == 'master' %}selected{% endif %}>Master</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="annee" class="form-label">Année</label>
                            <select class="form-select" id="annee" name="annee" required>
                                {% for i in range(1,6) %}
                                <option value="{{ i }}" {% if cours.annee == i %}selected{% endif %}>
                                    {{ i }}ère Année
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- Ajoutez ce champ pour les crédits -->
<div class="mb-3">
    <label for="credits" class="form-label">Crédits</label>
    <input type="number" class="form-control" id="credits" name="credits" 
           value="{{ cours.credits }}" min="1" max="10" required>
</div>
                    
                    <div class="mb-3">
                        <label for="professeur" class="form-label">Professeur</label>
                        <select class="form-select" id="professeur" name="professeur" required>
                            {% for prof in professeurs %}
                            <option value="{{ prof.id }}" {% if cours.professeur_id == prof.id %}selected{% endif %}>
                                {{ prof.prenom }} {{ prof.nom }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="fichier" class="form-label">Fichier du cours</label>
                        <input class="form-control" type="file" id="fichier" name="fichier">
                        <div class="form-text">Fichier actuel: {{ cours.fichier }}</div>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="submit" class="btn btn-primary me-md-2">Enregistrer</button>
                        <a href="{{ url_for('courses.courses') }}" class="btn btn-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
