{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Ressources pour {{ cours.titre }}</h2>
    
    <div class="ressources-list">
        {% for ressource in ressources %}
        <div class="ressource-item">
            <h3>{{ ressource.nom }}</h3>
            <p>Type: {{ ressource.type }} | Taille: {{ ressource.taille }}</p>
            <a href="{{ url_for('courses.telecharger_ressource', ressource_id=ressource.id) }}"
               class="btn btn-primary">
                Télécharger
            </a>
        </div>
        {% else %}
        <p>Aucune ressource disponible pour ce cours.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
