{% extends 'layouts/page_principale_base.html' %}
{% block title %}{{ action }} une UE{% endblock %}
{% block principale_extra_css %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600&display=swap" rel="stylesheet">
<style>
 body {background:#020617;color:#e2e8f0;font-family:'Manrope',sans-serif;}
 .shell {max-width:960px;margin:0 auto;}
 .glass {background:rgba(15,23,42,0.85);border-radius:28px;padding:2.5rem;border:1px solid rgba(94,234,212,0.15);box-shadow:0 35px 70px rgba(2,6,23,0.7);} 
 label {text-transform:uppercase;font-size:0.75rem;letter-spacing:0.08em;color:#94a3b8;font-weight:600;}
 .form-control,.form-select {background:rgba(15,23,42,0.6);border:1px solid rgba(148,163,184,0.3);color:#f8fafc;border-radius:16px;padding:0.85rem 1.1rem;}
 .btn-primary {background:linear-gradient(120deg,#22d3ee,#6366f1);border:none;border-radius:18px;padding:0.9rem 2.5rem;font-weight:600;letter-spacing:0.05em;}
</style>
{% endblock %}
{% block principale_content %}
<div class="container py-5 shell">
    <div class="mb-4 text-center text-uppercase text-sm text-teal-200">Structure académique</div>
    <div class="glass">
        <h2 class="mb-4">{{ action }} une unité d'enseignement</h2>
        <form method="post">
            <div class="row g-4">
                <div class="col-md-6">
                    <label>Code</label>
                    <input type="text" name="code" class="form-control" value="{{ ue.code if ue else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label>Intitulé</label>
                    <input type="text" name="intitule" class="form-control" value="{{ ue.intitule if ue else '' }}" required>
                </div>
                <div class="col-md-12">
                    <label>Description</label>
                    <textarea name="description" rows="3" class="form-control">{{ ue.description if ue else '' }}</textarea>
                </div>
                <div class="col-md-3">
                    <label>Crédits</label>
                    <input type="number" name="credits" class="form-control" value="{{ ue.credits if ue else '' }}" required>
                </div>
                <div class="col-md-3">
                    <label>Coefficient</label>
                    <input type="number" step="0.1" name="coefficient" class="form-control" value="{{ ue.coefficient if ue else '' }}" required>
                </div>
                <div class="col-md-3">
                    <label>Cycle</label>
                    <select name="cycle" class="form-select" required>
                        <option value="licence" {% if ue and ue.cycle == 'licence' %}selected{% endif %}>Licence</option>
                        <option value="master" {% if ue and ue.cycle == 'master' %}selected{% endif %}>Master</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label>Niveau</label>
                    <select name="niveau" class="form-select" required>
                        {% for niveau in ['L1','L2','L3','M1','M2'] %}
                            <option value="{{ niveau }}" {% if ue and ue.niveau == niveau %}selected{% endif %}>{{ niveau }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label>Semestre</label>
                    <select name="semestre" class="form-select">
                        <option value="1" {% if ue and ue.semestre == 1 %}selected{% endif %}>S1</option>
                        <option value="2" {% if ue and ue.semestre == 2 %}selected{% endif %}>S2</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label>Filière</label>
                    <select name="filiere_id" class="form-select">
                        <option value="">Sélectionner</option>
                        {% for filiere in filieres %}
                            <option value="{{ filiere.id }}" {% if ue and ue.filiere_id == filiere.id %}selected{% endif %}>{{ filiere.nom }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label>Année académique</label>
                    <input type="text" name="annee_academique" class="form-control" value="{{ ue.annee_academique if ue else current_year }}" required>
                </div>
                <div class="col-md-3">
                    <label>Capitalisable ?</label>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" name="est_capitalizable" {% if ue is none or ue.est_capitalizable %}checked{% endif %}>
                        <label class="form-check-label">Oui</label>
                    </div>
                </div>
                <div class="col-md-3">
                    <label>Volume CM</label>
                    <input type="number" name="volume_cm" class="form-control" value="{{ ue.volume_cm if ue else 0 }}">
                </div>
                <div class="col-md-3">
                    <label>Volume TD</label>
                    <input type="number" name="volume_td" class="form-control" value="{{ ue.volume_td if ue else 0 }}">
                </div>
                <div class="col-md-3">
                    <label>Volume TP</label>
                    <input type="number" name="volume_tp" class="form-control" value="{{ ue.volume_tp if ue else 0 }}">
                </div>
                <div class="col-md-3">
                    <label>Type UE</label>
                    <input type="text" name="type_ue" class="form-control" value="{{ ue.type_ue if ue else '' }}">
                </div>
                <div class="col-md-6">
                    <label>Nature</label>
                    <select name="nature" class="form-select">
                        <option value="obligatoire" {% if ue and ue.nature == 'obligatoire' %}selected{% endif %}>Obligatoire</option>
                        <option value="optionnelle" {% if ue and ue.nature == 'optionnelle' %}selected{% endif %}>Optionnelle</option>
                    </select>
                </div>
                <div class="col-12">
                    <label>Prérequis</label>
                    <textarea name="prerequis" rows="3" class="form-control">{{ ue.prerequis if ue else '' }}</textarea>
                </div>
            </div>
            <div class="d-flex justify-content-between mt-4">
                <a href="{{ url_for('academique.liste_ues') }}" class="btn btn-outline-light">Annuler</a>
                <button type="submit" class="btn btn-primary">{{ action }} l'unité</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
