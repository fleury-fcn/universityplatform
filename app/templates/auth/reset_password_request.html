{% extends "base.html" %}

{% block content %}
<div class="dashboard-container">
    <aside class="sidebar">
        <div class="user-profile">
            <img src="{{ current_user.get_avatar_url() }}" alt="Photo de profil" class="avatar">
            <h3>Réinitialisation</h3>
        </div>
        
        <nav class="nav-menu">
            <a href="{{ url_for('auth.login') }}" class="nav-item">
                <i class="fas fa-arrow-left"></i> Retour
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="welcome-banner">
            <h1><i class="fas fa-key"></i> Réinitialisation du mot de passe</h1>
            <p>Entrez votre email institutionnel pour recevoir le lien</p>
            <div class="date-display">
                <i class="far fa-envelope"></i> {{ current_date }}
            </div>
        </div>

        <div class="auth-container">
            <div class="auth-card">
                <form method="POST" class="auth-form">
                    {{ form.hidden_tag() }}
                    
                    <div class="form-group">
                        <div class="input-container">
                            <i class="fas fa-envelope icon"></i>
                            <input type="email" 
                                   class="form-control" 
                                   id="email" 
                                   name="email" 
                                   required
                                   placeholder="prenom.nom@institution.edu">
                        </div>
                    </div>
                    
                    <button type="submit" class="action-btn full-width">
                        <i class="fas fa-paper-plane"></i> Envoyer le lien
                    </button>
                </form>
            </div>

            <div class="quick-links">
                <a href="{{ url_for('auth.login') }}" class="link-btn">
                    <i class="fas fa-sign-in-alt"></i> Retour à la connexion
                </a>
                <a href="{{ url_for('auth.register') }}" class="link-btn">
                    <i class="fas fa-user-plus"></i> Créer un compte
                </a>
            </div>
        </div>
    </main>
</div>
{% endblock %}

{% block styles %}
<style>
    .auth-container {
        max-width: 800px;
        margin: 0 auto;
    }

    .auth-card {
        background: white;
        border-radius: 10px;
        padding: 2rem;
        margin-bottom: 2rem;
        box-shadow: 0 5px 20px rgba(10, 36, 99, 0.1);
        border-top: 4px solid var(--primary);
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .input-container {
        position: relative;
    }

    .icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--primary);
    }

    .form-control {
        width: 100%;
        padding: 0.8rem 1rem 0.8rem 3rem;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s;
    }

    .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(10, 36, 99, 0.1);
        outline: none;
    }

    .action-btn {
        background: var(--primary);
        color: white;
        border: none;
        padding: 1rem;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
    }

    .action-btn:hover {
        background: #08316b;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(10, 36, 99, 0.2);
    }

    .full-width {
        width: 100%;
    }

    .quick-links {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
    }

    .link-btn {
        background: white;
        color: var(--primary);
        border: 2px solid var(--primary);
        padding: 0.8rem;
        border-radius: 8px;
        text-align: center;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
    }

    .link-btn:hover {
        background: var(--primary);
        color: white;
        transform: translateY(-2px);
    }

    @media (max-width: 768px) {
        .quick-links {
            grid-template-columns: 1fr;
        }
        
        .auth-card {
            padding: 1.5rem;
        }
    }
</style>
{% endblock %}
